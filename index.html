<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ImpaHub Obfuscator</title>
    <style>
        :root {
            --bg: #050505;
            --panel: #0d0d0d;
            --border-grey: #222;
            --accent-pink: #ff8fa3; 
            --glow: rgba(255, 143, 163, 0.2);
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Arial', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            opacity: 0.15;
        }

        .header-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-top: 60px;
            padding: 0 40px;
        }

        .main-title {
            font-size: 52px;
            font-weight: 800;
            margin: 0;
            text-align: center;
            flex-grow: 1;
            letter-spacing: -1px;
        }

        .credits {
            text-align: right;
            font-style: italic;
            color: var(--accent-pink);
            font-size: 16px;
            line-height: 1.5;
            white-space: nowrap;
        }

        .app-outer-border {
            width: 90%;
            max-width: 1100px;
            border: 1px solid var(--border-grey);
            padding: 20px;
            margin-top: 40px;
            background: rgba(5, 5, 5, 0.5);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .pane h3 {
            font-style: italic;
            font-weight: 300;
            margin: 0 0 15px 5px;
            font-size: 22px;
        }

        .text-container {
            background: #111;
            border: 1px solid #333;
            padding: 15px;
        }

        textarea {
            width: 100%;
            height: 320px;
            background: transparent;
            border: none;
            color: #777;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: none;
            outline: none;
        }

        .center-btn {
            margin-top: 40px;
        }

        .btn-obf {
            background: linear-gradient(to bottom, #333, #111);
            color: var(--accent-pink);
            border: 1px solid var(--accent-pink);
            padding: 12px 60px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 2px;
        }

        .btn-obf:hover {
            box-shadow: 0 0 20px var(--glow);
            filter: brightness(1.2);
        }

        .discord-orb-wrapper {
            margin: 60px 0;
            text-align: center;
        }

        .discord-circle {
            border: 1px solid var(--accent-pink);
            border-radius: 100px;
            padding: 25px 80px;
            display: inline-block;
            box-shadow: inset 0 0 15px var(--glow), 0 0 25px var(--glow);
            text-decoration: none;
            color: white;
        }

        .discord-circle img {
            width: 45px;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 5px white);
        }

        .discord-circle span {
            display: block;
            font-style: italic;
            font-size: 14px;
            margin-bottom: 2px;
        }

        .discord-circle b {
            color: var(--accent-pink);
            font-size: 13px;
            font-weight: 400;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="header-container">
        <div style="width: 200px;"></div> 
        <h1 class="main-title">ImpaHub Obfuscator.</h1>
        <div class="credits">
            made by two morons btw<br>
            yescries<br>
            Impadinno1q
        </div>
    </div>

    <div class="app-outer-border">
        <div class="grid">
            <div class="pane">
                <h3>paste ur script here boi</h3>
                <div class="text-container">
                    <textarea id="input" placeholder="paste ur script"></textarea>
                </div>
            </div>
            <div class="pane">
                <h3>here u go bro</h3>
                <div class="text-container">
                    <textarea id="output" readonly placeholder="here ur go bro"></textarea>
                </div>
            </div>
        </div>
    </div>

    <div class="center-btn">
        <button class="btn-obf" onclick="obfuscate()">pls work im tired</button>
    </div>

    <div class="discord-orb-wrapper">
        <a href="https://discord.gg/3aUx2UgyrM" class="discord-circle" target="_blank">
            <img src="https://cdn-icons-png.flaticon.com/512/3670/3670157.png" alt="discord">
            <span></span>
            <b>https://discord.gg/HDGRs22q</b>
        </a>
    </div>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const char = "01";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function draw() {
            ctx.fillStyle = "rgba(5, 5, 5, 0.1)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ffffff"; // Pure white matrix text
            ctx.font = fontSize + "px monospace";
            for (let i = 0; i < drops.length; i++) {
                const text = char.charAt(Math.floor(Math.random() * char.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(draw, 35);

        window.onresize = () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        };

        function obfuscate() {
            const src = document.getElementById('input').value;
            if(!src) return;

            const k = Math.floor(Math.random() * 50) + 100;
            const b = [];
            for(let i=0; i<src.length; i++) {
                b.push((src.charCodeAt(i) ^ k) + 3);
            }

            
            const res = `local _v={${b.join(',')}} local _k=${k} local _s="" local _e=error local _g=getfenv local function _t() if _g().print~=print or _g().warn~=warn then _e() end end _t() for i=1,#_v do _s=_s..string.char(bit32.bxor(_v[i]-3,_k)) end local _r=(loadstring or load)(_s) if not _r then _e() end _r()`.replace(/\s+/g, ' ');

            document.getElementById('output').value = res;
        }
    </script>
</body>
</html>
