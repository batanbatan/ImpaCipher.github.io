<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VoidVM // Enterprise</title>
    <style>
        :root {
            --bg: #09090b;
            --accent: #ffffff;
            --card: #141417;
            --border: #27272a;
            --text: #ececec;
            --text-dim: #71717a;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
        }

        header { margin-bottom: 40px; }
        h1 { font-size: 20px; font-weight: 600; letter-spacing: 1px; }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            background: var(--border);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .pane { background: var(--card); padding: 20px; }
        label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 15px; display: block; }

        textarea {
            width: 100%;
            height: 350px;
            background: transparent;
            border: none;
            color: #fff;
            font-family: monospace;
            font-size: 12px;
            resize: none;
            outline: none;
        }

        .actions { margin-top: 20px; display: flex; justify-content: flex-end; }
        
        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 30px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover { opacity: 0.8; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>VOID-VM <span style="color:var(--text-dim)">SYSTEMS</span></h1>
    </header>

    <div class="grid">
        <div class="pane">
            <label>Input</label>
            <textarea id="input"></textarea>
        </div>
        <div class="pane">
            <label>Output</label>
            <textarea id="output" readonly></textarea>
        </div>
    </div>

    <div class="actions">
        <button onclick="deploy()">DEPLOY</button>
    </div>
</div>

<script>
function deploy() {
    const input = document.getElementById('input').value;
    if(!input) return;

    let k = Math.floor(Math.random() * 100) + 30;
    let b = [];
    
    for(let i=0; i<input.length; i++) {
        b.push((input.charCodeAt(i) ^ k) + 7);
    }

    const res = `local _v={${b.join(',')}} local _k=${k} local _s="" local _e=error local _g=getfenv local function _t() if _g().print~=print or _g().warn~=warn then _e() end end _t() for i=1,#_v do _s=_s..string.char(bit32.bxor(_v[i]-7,_k)) end local _r=(loadstring or load)(_s) if not _r then _e() end _r()`.replace(/\s+/g, ' ');

    document.getElementById('output').value = res;
}
</script>

</body>
</html>
